<!-- ==========================================
Arquivo: login.html
Descrição: Tela de entrada do CertiAcademy. Autentica com a conta Google e
           devolve o aluno ao destino pretendido.
========================================== -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | CertiAcademy</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #fff;
      color: #3c4043;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, box-shadow .2s;
    }

    .btn-google:hover:not(:disabled) {
      background: #f7f8f8;
      box-shadow: 0 1px 3px rgba(60, 64, 67, .25);
    }

    .btn-google:focus-visible {
      outline: 3px solid #0078D4;
      outline-offset: 2px;
    }

    .btn-google:disabled {
      opacity: .6;
      cursor: progress;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800">

  <main class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">

      <div class="text-center mb-8">
        <img src="./imagens/certiacademy_logo.svg" alt="CertiAcademy" class="h-16 mx-auto mb-6">
        <h1 class="text-2xl font-bold mb-2">Entre para começar</h1>
        <p class="text-gray-600">Sua conta guarda o histórico dos simulados que você fizer e o seu desempenho por
          assunto.</p>
      </div>

      <div class="bg-white rounded-2xl shadow p-8">
        <button id="entrarBtn" class="btn-google" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          <span id="entrarTexto">Entrar com Google</span>
        </button>

        <p id="mensagem" class="mt-4 text-sm text-red-700 hidden" role="alert"></p>

        <p class="mt-6 text-xs text-gray-500 leading-relaxed">
          Ao entrar, guardamos seu nome, e-mail e os resultados dos simulados para montar o seu histórico.
          Veja a <a href="./privacidade.html" class="text-blue-600 underline">política de privacidade</a>.
        </p>
      </div>

      <p class="text-center mt-6">
        <a href="./" class="text-blue-600 text-sm">Voltar para a página inicial</a>
      </p>

    </div>
  </main>

  <script type="module">
    import { aguardarSessao, entrarComGoogle, destinoSeguro } from './shared/simulado-engine/common/js/auth.js';
    import { firebaseConfigurado } from './shared/simulado-engine/common/js/firebase-config.js';

    const entrarBtn = document.getElementById('entrarBtn');
    const entrarTexto = document.getElementById('entrarTexto');
    const mensagem = document.getElementById('mensagem');

    function destinoPosLogin() {
      const parametro = new URLSearchParams(window.location.search).get('next');
      return destinoSeguro(parametro) || './';
    }

    function mostrarErro(texto) {
      mensagem.textContent = texto;
      mensagem.classList.remove('hidden');
    }

    function ocupado(estaOcupado, rotulo) {
      entrarBtn.disabled = estaOcupado;
      entrarTexto.textContent = rotulo;
    }

    if (!firebaseConfigurado()) {
      ocupado(true, 'Login indisponível');
      mostrarErro('O login ainda não foi configurado neste ambiente. Preencha shared/simulado-engine/common/js/firebase-config.js com os dados do projeto Firebase.');
    } else {
      // Quem já tem sessão não precisa ver esta tela.
      aguardarSessao()
        .then(user => {
          if (user) window.location.replace(destinoPosLogin());
        })
        .catch(erro => {
          console.error('Falha ao verificar a sessao:', erro);
        });

      entrarBtn.addEventListener('click', async () => {
        mensagem.classList.add('hidden');
        ocupado(true, 'Abrindo o Google...');

        try {
          await entrarComGoogle();
          window.location.replace(destinoPosLogin());
        } catch (erro) {
          console.error('Falha no login:', erro);
          ocupado(false, 'Entrar com Google');

          const codigo = erro && erro.code ? erro.code : '';

          if (codigo === 'auth/popup-blocked') {
            mostrarErro('Seu navegador bloqueou a janela do Google. Libere os pop-ups para este site e tente de novo.');
          } else if (codigo === 'auth/popup-closed-by-user' || codigo === 'auth/cancelled-popup-request') {
            mostrarErro('A janela do Google foi fechada antes de concluir. Tente novamente.');
          } else if (codigo === 'auth/unauthorized-domain') {
            mostrarErro('Este domínio ainda não está autorizado no Firebase. Adicione-o em Authentication → Settings → Authorized domains.');
          } else if (codigo === 'auth/network-request-failed') {
            mostrarErro('Não foi possível falar com o Google. Verifique sua conexão e tente novamente.');
          } else {
            mostrarErro('Não foi possível entrar agora. Tente novamente em instantes.');
          }
        }
      });
    }
  </script>

</body>

</html>
