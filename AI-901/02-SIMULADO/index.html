<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-901 - Simulado 02 | AI-901</title>
  <link rel="stylesheet" href="../../shared/simulado-engine/common/css/styles.css" />
  <meta name="robots" content="noindex, nofollow">
</head>

<body data-requer-sessao>

  <div class="container">

    <!-- Navegação pelas questões -->
    <aside class="sidebar">
      <p class="sidebar-titulo">Questões</p>
      <ul id="listaQuestoes"></ul>
    </aside>

    <!-- Área da prova -->
    <main class="content">
      <button id="toggleSidebar" class="toggle-sidebar" type="button" aria-label="Mostrar ou ocultar a lista de questões">
        <span id="arrow" class="arrow">⮜</span>
      </button>

      <div id="progressoContainer">
        <span id="textoProgresso"></span>
        <div class="barra-externa">
          <div class="barra-interna" id="barraProgresso"></div>
        </div>
      </div>

      <div id="quiz">
        <div id="questaoContainer"></div>
      </div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="acoes-questao">
        <button id="voltarBtn" class="btn-voltar hidden" type="button">Voltar questão</button>
        <button id="confirmarBtn" class="btn-confirmar" type="button">Confirmar</button>
        <button id="proximaBtn" class="btn-proxima hidden" type="button">Próxima questão</button>
        <button id="finalizarBtn" class="btn-finalizar hidden" type="button">Finalizar</button>
      </div>

      <div id="resultadoFinal" class="results hidden"></div>
    </main>

    <!-- Outros simulados deste curso -->
    <aside class="sidebarDireita">
      <p class="sidebarDireita-titulo">AI-901</p>
      <ul class="lista-simulados">
          <li><a href="../01-SIMULADO/index.html">Simulado 01</a></li>
          <li><a href="../02-SIMULADO/index.html" class="atual" aria-current="page">Simulado 02</a></li>
          <li><a href="../03-SIMULADO/index.html">Simulado 03</a></li>
          <li><a href="../04-SIMULADO/index.html">Simulado 04</a></li>
      </ul>
    </aside>

  </div>

  <footer class="rodape-simulado">
    <a href="../curso.html" class="rf-btn rf-btn-secundario">Voltar ao curso</a>
  </footer>

  <button id="botaoReportar" class="btn-reportar-flutuante hidden" type="button">Reportar problema</button>

  <div id="modalProblema" class="modal hidden">
    <div class="modal-content">
      <h2>Reportar problema</h2>
      <textarea id="textoProblema" placeholder="Descreva o problema encontrado..." rows="6"></textarea>
      <div class="botoes-modal">
        <button id="enviarProblemaBtn" type="button">Enviar</button>
        <button id="cancelarProblemaBtn" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="../../shared/simulado-engine/common/js/app.js"></script>

  <script>
    // Trocar de simulado descarta a sessão atual, então vale confirmar.
    document.querySelectorAll(".lista-simulados a:not(.atual)").forEach(link => {
      link.addEventListener("click", evento => {
        if (!confirm("Você perderá a sessão atual do simulado e ingressará em um novo simulado. Deseja continuar?")) {
          evento.preventDefault();
        }
      });
    });

    // Recolher a lista de questões dá mais largura ao enunciado.
    const alternarSidebar = document.getElementById("toggleSidebar");
    const listaLateral = document.querySelector(".sidebar");
    const areaConteudo = document.querySelector(".content");

    alternarSidebar.addEventListener("click", () => {
      const oculta = listaLateral.classList.toggle("hidden");
      areaConteudo.classList.toggle("expandido", oculta);
      document.getElementById("arrow").textContent = oculta ? "⮞" : "⮜";
      alternarSidebar.setAttribute("aria-expanded", String(!oculta));
    });
  </script>

</body>

</html>
